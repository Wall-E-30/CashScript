{% extends "base.html" %}
{% block title %}Add Expense - {{ group.name }}{% endblock %}

{% block content %}
<div class="container mt-4 max-w-md" style="max-width: 600px; margin: auto;">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h4 class="mb-0">Add Expense to {{ group.name }}</h4>
        </div>
        <div class="card-body">
            <form action="{{ url_for('main.add_group_expense', group_id=group.id) }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">What was this for?</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g., Dinner at Mario's" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Total Amount (Paid by you)</label>
                    <div class="input-group">
                        <span class="input-group-text">₹</span>
                        <input type="number" step="0.01" name="amount" class="form-control" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Split equally with:</label>
                    <div class="border rounded p-3 bg-light">
                        {% for member in members %}
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="split_with" value="{{ member.user.id }}" id="user{{ member.user.id }}" checked>
                            <label class="form-check-label" for="user{{ member.user.id }}">
                                {{ member.user.username }} {% if member.user.id == current_user.id %}(You){% endif %}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                    <small class="text-muted mt-1 d-block">Uncheck anyone who wasn't involved.</small>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Split Expense</button>
                    <a href="{{ url_for('main.group_detail', group_id=group.id) }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
